<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Metazooa Guesser</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz@9..40&family=Monomaniac+One&family=Gluten&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #faf7f0;
            --dark: #1a1a1a;
            --sage: #6b8e6f;
            --accent: #d4a574;
            --border: #e8ddd0;
        }

        body {
            font-family: "Georgia", serif;
            background: linear-gradient(135deg, var(--cream) 0%, #f5ede3 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.5px;
            font-family: "Gluten", sans-serif;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 32px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--sage);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: "Georgia", serif;
            font-size: 14px;
            background: #fafaf8;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--sage);
            background: white;
            box-shadow: 0 0 0 2px rgba(107, 142, 111, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-size: 13px;
        }

        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
            font-style: italic;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--sage);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "Georgia", serif;
        }

        button:hover:not(:disabled) {
            background: #5a7b5e;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(107, 142, 111, 0.2);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 32px;
            padding: 24px;
            background: #f9f7f3;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-species {
            font-size: 20px;
            font-weight: 600;
            color: var(--sage);
            margin-bottom: 4px;
        }

        .result-scientific {
            font-size: 13px;
            color: #888;
            font-style: italic;
            margin-bottom: 16px;
        }

        .alternatives {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .alternatives-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .alternative-item {
            font-size: 12px;
            color: #666;
            padding: 6px 0;
            line-height: 1.4;
        }

        .alternative-item .name {
            font-weight: 500;
            color: #555;
        }

        .alternative-item .scientific {
            font-style: italic;
            color: #999;
        }

        .error {
            color: #c94a4a;
            font-size: 13px;
            padding: 12px;
            background: #fef3f3;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            text-align: center;
            color: var(--sage);
            font-style: italic;
            margin-top: 16px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .game-switcher {
            display: flex;
            gap: 8px;
        }

        .game-btn {
            width: 36px;
            height: 36px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }

        .game-btn:hover {
            border-color: var(--sage);
            background: #f9f7f3;
        }

        .game-btn.active {
            background: var(--sage);
            border-color: var(--sage);
            color: white;
        }

        .strategy-selector {
            margin-bottom: 24px;
            padding: 16px;
            background: #f9f7f3;
            border-radius: 4px;
            border: 1px solid var(--border);
        }

        .strategy-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--sage);
        }

        .strategy-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .strategy-btn {
            width: 100%;
            padding: 8px 12px;
            background: white;
            color: var(--sage);
            border: 2px solid var(--border);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: "Georgia", serif;
        }

        .strategy-btn:hover {
            border-color: var(--sage);
            background: #f0f0f0;
        }

        .strategy-btn.active {
            background: var(--sage);
            color: white;
            border-color: var(--sage);
        }

        .strategy-description {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }

        footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        footer a {
            color: var(--sage);
            text-decoration: none;
            transition: color 0.2s;
            margin: 0 8px;
        }

        footer a:hover {
            color: #5a7b5e;
            text-decoration: underline;
        }

        .footer-separator {
            color: #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1 id="game-title">Metazooa</h1>
            <div class="game-switcher">
                <button type="button" class="game-btn active" id="btn-metazooa" title="Animals">🦁</button>
                <button type="button" class="game-btn" id="btn-metaflora" title="Plants">🌿</button>
            </div>
        </div>
        <p class="subtitle">Find your perfect species</p>

        <div class="error" id="error"></div>

        <div class="strategy-selector">
            <label class="strategy-label">Strategy</label>
            <div class="strategy-buttons">
                <button type="button" class="strategy-btn active" id="btn-minimax" title="Worst-case optimal">Minimax</button>
                <button type="button" class="strategy-btn" id="btn-entropy" title="Average-case optimal">Entropy</button>
                <button type="button" class="strategy-btn" id="btn-hybrid" title="Balanced approach">Hybrid</button>
            </div>
            <p class="strategy-description" id="strategy-desc">Minimizes worst-case number of guesses</p>
        </div>

        <form id="guesser-form">
            <div class="form-group">
                <label for="clade">Clade</label>
                <input
                    type="text"
                    id="clade"
                    name="clade"
                    required
                    placeholder="e.g., Mammalia, Aves, Insecta"
                >
                <p class="help-text">Enter the clade to search within</p>
            </div>

            <div class="form-group">
                <label for="exclusions">Exclude Species (Optional)</label>
                <textarea
                    id="exclusions"
                    name="exclusions"
                    placeholder="One species per line&#10;e.g., Dog&#10;Cat&#10;Dolphin"
                ></textarea>
                <p class="help-text">Enter species names (common names or scientific names)</p>
            </div>

            <button type="submit">Find Best Guess</button>
        </form>

        <div class="loading" id="loading">Processing...</div>

        <div class="result" id="result">
            <div class="result-label">Best Guess</div>
            <div class="result-species" id="result-name"></div>
            <div class="result-scientific" id="result-scientific"></div>

            <div class="alternatives" id="alternatives" style="display: none;">
                <div class="alternatives-label">Other Good Guesses</div>
                <div id="alternatives-list"></div>
            </div>
        </div>

        <footer>
            <a href="https://metazooa.com" target="_blank">Play the Game</a>
            <span class="footer-separator">•</span>
            <a href="https://github.com/alexjercan/metazooa" target="_blank">GitHub</a>
        </footer>
    </div>

    <script>
        // Game configuration mapping
        const GAME_CONFIG = {
            metazooa: {
                title: 'Metazooa',
                subtitle: 'Find your perfect animal',
                cladeExample: 'e.g., Mammalia, Aves, Insecta',
                exampleSpecies: 'Dog, Cat, Dolphin'
            },
            metaflora: {
                title: 'Metaflora',
                subtitle: 'Find your perfect plant',
                cladeExample: 'e.g., Magnoliopsida, Monocots, Eudicots',
                exampleSpecies: 'Rose, Oak, Grass'
            }
        };

        // Strategy configuration mapping
        const STRATEGY_CONFIG = {
            minimax: {
                title: 'Minimax',
                description: 'Minimizes worst-case number of guesses'
            },
            entropy: {
                title: 'Entropy',
                description: 'Minimizes average-case number of guesses (information theory)'
            },
            hybrid: {
                title: 'Hybrid',
                description: 'Balanced approach combining minimax and entropy'
            }
        };

        // Get game type from query params
        function getGameType() {
            const params = new URLSearchParams(window.location.search);
            const game = params.get('game') || 'metazooa';
            return game;
        }

        // Get strategy from query params
        function getStrategy() {
            const params = new URLSearchParams(window.location.search);
            const strategy = params.get('strategy') || 'minimax';
            return strategy;
        }

        const GAME_TYPE = getGameType();
        const STRATEGY_TYPE = getStrategy();
        const GAME_INFO = GAME_CONFIG[GAME_TYPE] || GAME_CONFIG.metazooa;
        const STRATEGY_INFO = STRATEGY_CONFIG[STRATEGY_TYPE] || STRATEGY_CONFIG.minimax;

        // Update page with game-specific content
        function initializeGameUI() {
            document.getElementById('page-title').textContent = `${GAME_INFO.title} Guesser`;
            document.getElementById('game-title').textContent = GAME_INFO.title;
            document.querySelector('.subtitle').textContent = GAME_INFO.subtitle;
            document.getElementById('clade').placeholder = GAME_INFO.cladeExample;
            document.getElementById('exclusions').placeholder =
                `One species per line\ne.g., ${GAME_INFO.exampleSpecies}`;
        }

        // Update strategy description
        function updateStrategyDescription() {
            document.getElementById('strategy-desc').textContent = STRATEGY_INFO.description;
        }

        // Taxonomy algorithms
        function findRoots(graph) {
            const allNodes = new Set(Object.keys(graph));
            const children = new Set();
            for (const kids of Object.values(graph)) {
                for (const child of kids) {
                    children.add(child);
                }
            }
            return Array.from(allNodes).filter(n => !children.has(n));
        }

        function findParent(graph, child) {
            for (const [parent, children] of Object.entries(graph)) {
                if (children.includes(child)) {
                    return parent;
                }
            }
            return null;
        }

        function isAncestorOf(graph, ancestor, descendant) {
            let parent = findParent(graph, descendant);
            while (parent !== null) {
                if (parent.toLowerCase() === ancestor.toLowerCase()) return true;
                parent = findParent(graph, parent);
            }
            return false;
        }

        function removeNode(graph, node) {
            const children = graph[node] || [];
            delete graph[node];
            for (const child of children) {
                removeNode(graph, child);
            }
        }

        function pruneGraph(graph, clade, species) {
            const cladeLower = clade.toLowerCase();
            let actualClade = null;
            for (const key of Object.keys(graph)) {
                if (key.toLowerCase() === cladeLower) {
                    actualClade = key;
                    break;
                }
            }

            if (!actualClade) {
                return {};
            }

            const newGraph = {};
            for (const [k, v] of Object.entries(graph)) {
                if (isAncestorOf(graph, actualClade, k) || k === actualClade) {
                    newGraph[k] = [...v];
                }
            }

            let workingGraph = newGraph;

            for (const speciesName of species) {
                const speciesLower = speciesName.toLowerCase();
                let actualSpecies = null;
                for (const key of Object.keys(workingGraph)) {
                    if (key.toLowerCase() === speciesLower) {
                        actualSpecies = key;
                        break;
                    }
                }

                if (!actualSpecies) continue;

                let currentNode = actualSpecies;
                let parent = findParent(workingGraph, currentNode);

                if (parent === null) continue;

                while (parent !== actualClade && parent !== null) {
                    currentNode = parent;
                    parent = findParent(workingGraph, currentNode);
                    if (parent === null) break;
                }

                if (parent && parent.toLowerCase() === actualClade.toLowerCase()) {
                    removeNode(workingGraph, currentNode);
                    const children = workingGraph[actualClade] || [];
                    workingGraph[actualClade] = children.filter(c => c !== currentNode);
                }
            }

            return workingGraph;
        }

        function isLeaf(graph, node) {
            return (graph[node] || []).length === 0;
        }

        function buildParentMap(tree) {
            const parentMap = {};
            for (const [p, children] of Object.entries(tree)) {
                for (const c of children) {
                    parentMap[c] = p;
                }
            }
            return parentMap;
        }

        function lca(tree, a, b) {
            const parentMap = buildParentMap(tree);
            const ancestors = new Set();

            let x = a;
            while (x in parentMap) {
                ancestors.add(x);
                x = parentMap[x];
            }
            ancestors.add(x);

            let y = b;
            while (!ancestors.has(y)) {
                y = parentMap[y];
            }
            return y;
        }

        function computeEntropy(size) {
            if (size <= 1) return 0;
            return Math.log2(size);
        }

        function bestLeafGuessMinimax(tree) {
            const candidates = Object.keys(tree).filter(node => isLeaf(tree, node));

            if (candidates.length === 0) return [];

            let bestGuesses = [];
            let bestWorstCase = Infinity;

            for (const guess of candidates) {
                const buckets = {};

                for (const leaf of candidates) {
                    const clade = lca(tree, guess, leaf);
                    buckets[clade] = (buckets[clade] || 0) + 1;

                    if (buckets[clade] >= bestWorstCase) break;
                }

                const worstCase = Math.max(...Object.values(buckets));
                if (worstCase < bestWorstCase) {
                    bestWorstCase = worstCase;
                    bestGuesses = [guess];
                } else if (worstCase === bestWorstCase) {
                    bestGuesses.push(guess);
                }
            }

            return bestGuesses;
        }

        function bestLeafGuessEntropy(tree) {
            const candidates = Object.keys(tree).filter(node => isLeaf(tree, node));

            if (candidates.length === 0) return [];

            const initialEntropy = computeEntropy(candidates.length);

            if (initialEntropy === 0) return candidates;

            let bestInfoGain = -1;
            let bestGuesses = [];

            for (const guess of candidates) {
                const feedbackGroups = {};

                for (const leaf of candidates) {
                    const clade = lca(tree, guess, leaf);
                    feedbackGroups[clade] = (feedbackGroups[clade] || 0) + 1;
                }

                let expectedEntropyAfter = 0;
                const total = candidates.length;

                for (const groupSize of Object.values(feedbackGroups)) {
                    const prob = groupSize / total;
                    const groupEntropy = computeEntropy(groupSize);
                    expectedEntropyAfter += prob * groupEntropy;
                }

                const infoGain = initialEntropy - expectedEntropyAfter;

                if (infoGain > bestInfoGain + 1e-9) {
                    bestInfoGain = infoGain;
                    bestGuesses = [guess];
                } else if (Math.abs(infoGain - bestInfoGain) < 1e-9) {
                    bestGuesses.push(guess);
                }
            }

            return bestGuesses;
        }

        function bestLeafGuessHybrid(tree) {
            const candidates = Object.keys(tree).filter(node => isLeaf(tree, node));

            if (candidates.length === 0) return [];

            const initialEntropy = computeEntropy(candidates.length);
            const scores = {};

            // Calculate scores for each candidate
            for (const guess of candidates) {
                const feedbackGroups = {};

                for (const leaf of candidates) {
                    const clade = lca(tree, guess, leaf);
                    feedbackGroups[clade] = (feedbackGroups[clade] || 0) + 1;
                }

                const worstCase = Math.max(...Object.values(feedbackGroups));
                let expectedEntropyAfter = 0;
                const total = candidates.length;

                for (const groupSize of Object.values(feedbackGroups)) {
                    const prob = groupSize / total;
                    const groupEntropy = computeEntropy(groupSize);
                    expectedEntropyAfter += prob * groupEntropy;
                }

                const infoGain = initialEntropy - expectedEntropyAfter;

                scores[guess] = {
                    worstCase: worstCase,
                    infoGain: infoGain
                };
            }

            // Normalize and combine scores
            const worstCases = Object.values(scores).map(s => s.worstCase);
            const infoGains = Object.values(scores).map(s => s.infoGain);

            const minWorst = Math.min(...worstCases);
            const maxWorst = Math.max(...worstCases);
            const minGain = Math.min(...infoGains);
            const maxGain = Math.max(...infoGains);

            const worstRange = maxWorst > minWorst ? maxWorst - minWorst : 1;
            const gainRange = maxGain > minGain ? maxGain - minGain : 1;

            let bestHybridScore = -Infinity;
            let bestGuesses = [];

            for (const guess of candidates) {
                const worstNorm = (scores[guess].worstCase - minWorst) / worstRange;
                const gainNorm = (scores[guess].infoGain - minGain) / gainRange;

                // Balanced: prefer higher info gain (entropy) but also consider worst case
                const hybridScore = 0.5 * gainNorm + 0.5 * (1 - worstNorm);

                if (hybridScore > bestHybridScore + 1e-9) {
                    bestHybridScore = hybridScore;
                    bestGuesses = [guess];
                } else if (Math.abs(hybridScore - bestHybridScore) < 1e-9) {
                    bestGuesses.push(guess);
                }
            }

            return bestGuesses;
        }

        function jsonTreeToGraph(jsonTree, nameMap) {
            const graph = {};

            function traverse(node) {
                const scientific = node.scientific;
                graph[scientific] = [];

                if (node.scientific && node.name) {
                    nameMap[node.scientific] = node.name;
                }

                if (node.children) {
                    for (const child of node.children) {
                        const childScientific = child.scientific;
                        graph[scientific].push(childScientific);
                        traverse(child);
                    }
                }
            }

            traverse(jsonTree);
            return graph;
        }

        function lowerCaseGraph(graph) {
            const lowercaseGraph = {};
            for (const [key, children] of Object.entries(graph)) {
                const lowerKey = key.toLowerCase();
                lowercaseGraph[lowerKey] = children.map(c => c.toLowerCase());
            }
            return lowercaseGraph;
        }

        function lowerCaseNameMap(nameMap) {
            const lowercaseNameMap = {};
            for (const [scientific, common] of Object.entries(nameMap)) {
                const lowerScientific = scientific.toLowerCase();
                lowercaseNameMap[lowerScientific] = common;
            }
            return lowercaseNameMap;
        }

        // UI handling
        const form = document.getElementById('guesser-form');
        const errorDiv = document.getElementById('error');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');
        const resultName = document.getElementById('result-name');
        const resultScientific = document.getElementById('result-scientific');
        const alternativesDiv = document.getElementById('alternatives');
        const alternativesList = document.getElementById('alternatives-list');

        let graph = {};
        let nameMap = {};

        // Load data
        async function loadData() {
            try {
                const treeFile = `commontree-${GAME_TYPE}.json`;
                const treeRes = await fetch(treeFile);
                if (!treeRes.ok) {
                    throw new Error(`Could not load ${treeFile}`);
                }
                const treeJson = await treeRes.json();
                graph = jsonTreeToGraph(treeJson, nameMap);
                graph = lowerCaseGraph(graph);
                nameMap = lowerCaseNameMap(nameMap);
            } catch (err) {
                showError(`Failed to load data: ${err.message}`);
            }
        }

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
        }

        function hideError() {
            errorDiv.classList.remove('show');
        }

        function chooseRandomGuess(guesses) {
            if (guesses.length === 0) return null;
            const idx = Math.floor(Math.random() * guesses.length);
            return guesses[idx];
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            hideError();

            const clade = document.getElementById('clade').value.trim();
            const exclusionsText = document.getElementById('exclusions').value.trim();
            const exclusions = exclusionsText ? exclusionsText.split('\n').map(s => s.trim()).filter(s => s) : [];

            if (!clade) {
                showError('Please enter a clade');
                return;
            }

            loadingDiv.classList.add('show');
            resultDiv.classList.remove('show');

            setTimeout(() => {
                try {
                    const scientificMap = Object.fromEntries(Object.entries(nameMap).map(([k, v]) => [v.toLowerCase(), k]));
                    const exclusionScientific = exclusions.map(s => scientificMap[s.toLowerCase()] || s);

                    const tree = pruneGraph(graph, clade, exclusionScientific);

                    let guesses;
                    if (STRATEGY_TYPE === 'minimax') {
                        guesses = bestLeafGuessMinimax(tree);
                    } else if (STRATEGY_TYPE === 'entropy') {
                        guesses = bestLeafGuessEntropy(tree);
                    } else if (STRATEGY_TYPE === 'hybrid') {
                        guesses = bestLeafGuessHybrid(tree);
                    } else {
                        guesses = bestLeafGuessMinimax(tree);
                    }

                    if (guesses.length === 0) {
                        showError(`No valid candidates found in clade "${clade}"`);
                    } else {
                        const primaryGuess = chooseRandomGuess(guesses);
                        const commonName = nameMap[primaryGuess] || primaryGuess;

                        resultName.textContent = commonName;
                        resultScientific.textContent = `(${primaryGuess})`;

                        if (guesses.length > 1) {
                            const otherGuesses = guesses.filter(g => g !== primaryGuess);
                            alternativesList.innerHTML = otherGuesses.map(guess => {
                                const commonAlt = nameMap[guess] || guess;
                                return `
                                    <div class="alternative-item">
                                        <span class="name">${commonAlt}</span><br>
                                        <span class="scientific">${guess}</span>
                                    </div>
                                `;
                            }).join('');
                            alternativesDiv.style.display = 'block';
                        } else {
                            alternativesDiv.style.display = 'none';
                        }

                        resultDiv.classList.add('show');
                    }
                } catch (err) {
                    showError(`Error: ${err.message}`);
                }
                loadingDiv.classList.remove('show');
            }, 100);
        });

        // Initialize
        initializeGameUI();
        updateStrategyDescription();
        loadData();

        // Game switcher buttons
        document.getElementById('btn-metazooa').addEventListener('click', (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            params.set('game', 'metazooa');
            window.location.href = `?${params.toString()}`;
        });

        document.getElementById('btn-metaflora').addEventListener('click', (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            params.set('game', 'metaflora');
            window.location.href = `?${params.toString()}`;
        });

        // Strategy switcher buttons
        document.getElementById('btn-minimax').addEventListener('click', (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            params.set('strategy', 'minimax');
            window.location.href = `?${params.toString()}`;
        });

        document.getElementById('btn-entropy').addEventListener('click', (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            params.set('strategy', 'entropy');
            window.location.href = `?${params.toString()}`;
        });

        document.getElementById('btn-hybrid').addEventListener('click', (e) => {
            e.preventDefault();
            const params = new URLSearchParams(window.location.search);
            params.set('strategy', 'hybrid');
            window.location.href = `?${params.toString()}`;
        });

        // Update active buttons
        function updateActiveButtons() {
            document.getElementById('btn-metazooa').classList.toggle('active', GAME_TYPE === 'metazooa');
            document.getElementById('btn-metaflora').classList.toggle('active', GAME_TYPE === 'metaflora');
            document.getElementById('btn-minimax').classList.toggle('active', STRATEGY_TYPE === 'minimax');
            document.getElementById('btn-entropy').classList.toggle('active', STRATEGY_TYPE === 'entropy');
            document.getElementById('btn-hybrid').classList.toggle('active', STRATEGY_TYPE === 'hybrid');
        }
        updateActiveButtons();
    </script>
</body>
</html>
